# pyproject.toml

[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eegproc"
version = "2.0.0"
description = "EEG preprocessing, featurization, and subject-wise cross-validation"
readme = "README.md"
authors = [{ name = "Tolas", email = "inserra.vitor@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = ["eeg", "entropy", "preprocessing", "featurization", "neuroscience", "bci", "cross-validation"]

# Base install: preprocessing, featurization, the data layer and dataset
# conversion, and plotting. No TensorFlow.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "PyWavelets>=1.4",
    "EMD-signal>=1.6",
    "matplotlib>=3.7",
]

# PEP 604 unions appear unquoted in function signatures, so 3.10 is a hard floor.
requires-python = ">=3.10"

[project.scripts]
eegproc-to-csv = "eegproc.data.to_csv:main"

[project.urls]
Homepage = "https://github.com/EEGo-UNC/EEGProc"
Documentation = "https://eego-unc.github.io/EEGProc/"
Source = "https://github.com/EEGo-UNC/EEGProc"
Issues = "https://github.com/EEGo-UNC/EEGProc/issues"
Changelog = "https://github.com/EEGo-UNC/EEGProc/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Optional models, cross-validation, and differentiable counterfactuals.
deep-learning = [
  "tensorflow>=2.16",
  "scikit-learn>=1.3",
  "cloudpickle>=2.2",
]
docs = [
  "sphinx>=7.2",
  "sphinx-rtd-theme>=2.0",
  "sphinx-autodoc-typehints>=2.0",
  "sphinx-copybutton>=0.5.2",
  "myst-parser>=3.0.1",
  "nbsphinx>=0.9.5",
  "ipykernel>=6.29",
]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "build>=1.0", "twine>=5"]

[tool.setuptools.packages.find]
where   = ["src"]
include = ["eegproc*"]
exclude = ["tests*"]

[tool.bumpver]
current_version = "2.0.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
tag_message = "v{new_version}"
tag_name = "v{new_version}"
# Bump in a PR; the release workflow tags and publishes after the merge to main.
commit = false
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
"CITATION.cff" = [
    '^version: {version}',
]
