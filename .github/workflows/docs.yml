name: Build & Deploy Docs

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds on every push and pull request so broken docs surface before main.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            docs/requirements.txt

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r docs/requirements.txt

      - name: Generate API stubs
        run: |
          python -m sphinx.ext.apidoc -o docs/source/api src/eegproc --module-first --separate --force \
            src/eegproc/deep_learning/cross_val.py

      - name: Build Sphinx
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: |
          python -m sphinx -W --keep-going -b html docs/source _site
          touch _site/.nojekyll

      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: _site
          include-hidden-files: true
          overwrite: true

  # Publishes to GitHub Pages (gh-pages branch) only from main.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: _site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site
          force_orphan: true
