name: Build package

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check distribution contents
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path('dist').glob('*.whl'))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
          roots = {name.split('/')[0] for name in names if not name.split('/')[0].endswith('.dist-info')}
          assert roots == {'eegproc'}, roots
          forbidden = ('/joint_architectures/', '/sic_adapter.py', '/slurm/', '/tests/', '/test_', '/smoke_', '/mtlfusenet/', '/stsnet/', '/cmhfe_dan/')
          assert not [name for name in names if any(part in name.lower() for part in forbidden)]
          assert 'eegproc/data/schema.py' in names
          assert 'eegproc/model_explainability/model_agnostic/optimizer.py' in names
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
