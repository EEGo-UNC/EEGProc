name: Tests

on:
  push:
    branches: [v2]
  pull_request:
    branches: [main]
  # release.yml runs this suite before anything is published.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Proves the base install needs no TensorFlow. A TF regression must never be
  # able to block a featurization change.
  base:
    name: base install (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install base package only
        run: |
          python -m pip install -U pip
          pip install ".[dev]"
          pip check

      - name: Assert TensorFlow is absent
        run: |
          if python -c "import tensorflow" 2>/dev/null; then
            echo "::error::TensorFlow is installed in the base environment; an extra has leaked into core dependencies."
            exit 1
          fi
          echo "TensorFlow correctly absent from the base install."

      - name: Run TensorFlow-free tests
        run: pytest -v --ignore=src/tests/test_cross_validation.py

  # The cross-validation stack, models, and counterfactuals.
  deep-learning:
    name: deep-learning extra (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with the deep-learning extra
        run: |
          python -m pip install -U pip
          pip install ".[deep-learning,dev]"
          pip check

      - name: Run the full suite with a coverage report
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: |
          pytest -v --cov=eegproc --cov-config=.coveragerc \
            --cov-report=term --cov-report=xml:coverage.xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
